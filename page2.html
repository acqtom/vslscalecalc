<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page 2</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1352e2; --blue-ink: #0b3fb8; --ink: #111111; --muted: #5c5c5c;
    --cream: #fdfbf3; --white: #ffffff; --panel: #e8eeee; --line: #e6e3d8; --ink-line: #1a1a1a;
    --ok: #16803c; --warn: #c2410c; --gold: #b7791f;
    --font-head: "Inter Tight", "Inter", system-ui, sans-serif; --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 12px; --shadow: 0 24px 48px -20px rgba(17, 17, 17, .22);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

  /* Top bar */
  .topbar { background: var(--white); border-bottom: 1px solid var(--line); }
  .topbar-in { max-width: 1320px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-family: var(--font-head); font-weight: 800; font-size: 21px; letter-spacing: -.02em; }
  .brand img { width: 34px; height: 34px; object-fit: contain; }
  .stars { color: var(--blue); font-size: 22px; letter-spacing: 1px; line-height: 1; }
  .top-right { display: flex; align-items: center; gap: 20px; }
  .nav-btn { font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--white); background: var(--blue); text-decoration: none; border: 2px solid var(--ink-line); border-radius: 6px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--ink-line); white-space: nowrap; transition: transform .12s, box-shadow .12s; }
  .nav-btn:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink-line); }
  .nav-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink-line); }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 48px 16px 64px; }
  @media (max-width: 600px) {
    .wrap { padding-top: 32px; }
    .stars { display: none; }
    .nav-btn { font-size: 14px; padding: 7px 12px; }
    .brand { font-size: 18px; }
    .frame { padding: 20px 16px; }
  }
</style></head><body>

<header class="topbar"><div class="topbar-in">
  <a class="brand" href="index.html"><img src="logo.png" alt="">Paidcoaching.com</a>
  <div class="top-right">
    <span class="stars" aria-label="5 stars">★★★★★</span>
    <a class="nav-btn" href="index.html">← Back To Calculator</a>
  </div>
</div></header>

<main class="wrap">
  <!-- Page content goes here -->
</main>
</body></html>
